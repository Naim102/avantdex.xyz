      try {
        var t = localStorage.getItem("avantdex.theme");
        var known = ["paper", "sky", "mint", "ink", "terminal"];
        if (t === "light") t = "paper";
        if (t === "dark") t = "ink";
        document.documentElement.setAttribute("data-theme", known.indexOf(t) >= 0 ? t : "paper");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "paper");
      }
