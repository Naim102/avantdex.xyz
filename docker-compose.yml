# Coolify: create a "Docker Compose" resource from this repo (branch main), then attach your domain
# to the `web` service on port 80. Coolify's proxy handles HTTPS, so no ports are published.
#
# This serves the prebuilt files in deploy/dist (no build step on the server). To change the contract
# address, deploy block or RPC, edit .env, run `bun run build:static`, commit deploy/dist and redeploy.
# To build from source on the server instead (needs ~1.5 GB RAM), set `dockerfile: Dockerfile.source`.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
