# Local development stack: PostgreSQL + anvil (local chain with Arc Testnet's chain id) + contract deployment + API + indexer.
#   docker compose -f docker-compose.dev.yml up --build
# Then run the frontend with:  VITE_RPC_URL=http://localhost:8545 bun run dev
# NOTHING here talks to a real network. Anvil dev accounts are public test accounts with no real value.
name: avantdex-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avantdex
      POSTGRES_PASSWORD: avantdex
      POSTGRES_DB: avantdex
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avantdex"]
      interval: 3s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "5042002", "--block-time", "1"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545"]
      interval: 3s
      retries: 20

  deployer:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    depends_on:
      anvil: { condition: service_healthy }
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/scripts/dev/deploy-local.sh"]
    volumes:
      - ./:/app
      - shared:/shared

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      deployer: { condition: service_completed_successfully }
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://avantdex:avantdex@postgres:5432/avantdex
      RPC_URL: http://anvil:8545
      JWT_SECRET: dev-only-secret-dev-only-secret-dev-only
      AUTH_DOMAIN: localhost
      AUTH_URI: http://localhost:5173
      # anvil account 0 owns the contract roles; it becomes super_admin of the dashboard
      BOOTSTRAP_ADMIN_ADDRESSES: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
    volumes:
      - shared:/shared:ro
    command: ["sh", "-c", ". /shared/addresses.env && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 30

  indexer:
    build: ./backend
    depends_on:
      api: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://avantdex:avantdex@postgres:5432/avantdex
      RPC_URL: http://anvil:8545
      INDEXER_POLL_SECONDS: "1"
    volumes:
      - shared:/shared:ro
    command: ["sh", "-c", ". /shared/addresses.env && python -m app.indexer.run"]

volumes:
  shared:
